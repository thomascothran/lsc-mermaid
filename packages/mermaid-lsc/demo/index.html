<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live Sequence Charts for Mermaid — demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 72rem;
      }
      .editor {
        display: grid;
        grid-template-columns: minmax(18rem, 1fr) 2fr;
        gap: 1rem;
        align-items: start;
      }
      textarea {
        width: 100%;
        min-height: 24rem;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        margin: 1rem 0;
        flex-wrap: wrap;
      }
      .error {
        color: #a00;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
      }
      figure {
        margin: 2rem 0;
      }
      figcaption {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Live Sequence Charts for Mermaid</h1>
    <p>
      Edit the chart; it re-renders as you type. The examples below are the worked examples of the
      proposal, rendered by the same plugin.
    </p>
    <div class="controls">
      <label>
        Example
        <select id="example"></select>
      </label>
      <label>
        Theme
        <select id="theme">
          <option>default</option>
          <option>dark</option>
          <option>forest</option>
          <option>neutral</option>
          <option>base</option>
        </select>
      </label>
      <label>
        Temperature cue
        <select id="cue">
          <option>line</option>
          <option>line+color</option>
          <option>line+badge</option>
        </select>
      </label>
      <label><input type="checkbox" id="diagnostics" checked /> Show diagnostics</label>
    </div>
    <div class="editor">
      <textarea id="source" spellcheck="false"></textarea>
      <div>
        <div id="output"></div>
        <div id="error" class="error"></div>
      </div>
    </div>
    <h2>Worked examples</h2>
    <div id="gallery"></div>

    <script type="module">
      import mermaid from '/packages/mermaid-lsc/node_modules/mermaid/dist/mermaid.esm.min.mjs';
      import lsc from '/packages/mermaid-lsc/dist/mermaid-lsc.esm.mjs';

      const names = [
        'fig01-visible-events',
        'fig02-car-departure',
        'fig03-existential',
        'fig04-prechart-cold-locations',
        'fig10-car-behavior',
        'fig11-standalone-subchart',
        'crossing-overtaking',
        'simultaneous-sends',
        'forbidden-scenario',
        'iteration-local-instances',
        'cold-defaults-notes',
        'simultaneous-coregion',
      ];
      const charts = Object.fromEntries(
        await Promise.all(
          names.map(async (n) => [n, await (await fetch(`/fixtures/${n}/chart.lsc`)).text()]),
        ),
      );
      await mermaid.registerExternalDiagrams([lsc]);

      const $ = (id) => document.getElementById(id);
      for (const n of names) $('example').add(new Option(n, n));
      $('source').value = charts[names[1]];
      $('example').value = names[1];

      function configure() {
        mermaid.initialize({
          startOnLoad: false,
          theme: $('theme').value,
          lsc: { temperatureCue: $('cue').value, showDiagnostics: $('diagnostics').checked },
        });
      }

      let counter = 0;
      async function renderEditor() {
        configure();
        try {
          const { svg } = await mermaid.render(`live-${++counter}`, $('source').value);
          $('output').innerHTML = svg;
          $('error').textContent = '';
        } catch (error) {
          $('error').textContent = error.message ?? String(error);
        }
      }

      async function renderGallery() {
        configure();
        const parts = [];
        for (const n of names) {
          const { svg } = await mermaid.render(`gallery-${n}-${++counter}`, charts[n]);
          parts.push(`<figure><figcaption>${n}</figcaption>${svg}</figure>`);
        }
        $('gallery').innerHTML = parts.join('');
        document.body.dataset.rendered = 'true';
      }

      $('source').addEventListener('input', renderEditor);
      $('example').addEventListener('change', () => {
        $('source').value = charts[$('example').value];
        renderEditor();
      });
      for (const id of ['theme', 'cue', 'diagnostics']) {
        $(id).addEventListener('change', async () => {
          await renderEditor();
          await renderGallery();
        });
      }
      await renderEditor();
      await renderGallery();
    </script>
  </body>
</html>
