<svg id="lsc-simultaneous-coregion" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="-98 -24 368.78 428" style="max-width: 368.78px;" role="graphics-document document" aria-roledescription="liveSequenceChart" aria-describedby="chart-desc-lsc-simultaneous-coregion"><desc id="chart-desc-lsc-simultaneous-coregion">Universal chart "Tap and refresh", 3 instances, 5 messages, activated by click</desc><style>#lsc-simultaneous-coregion{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#lsc-simultaneous-coregion .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#lsc-simultaneous-coregion .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#lsc-simultaneous-coregion .error-icon{fill:#552222;}#lsc-simultaneous-coregion .error-text{fill:#552222;stroke:#552222;}#lsc-simultaneous-coregion .edge-thickness-normal{stroke-width:1px;}#lsc-simultaneous-coregion .edge-thickness-thick{stroke-width:3.5px;}#lsc-simultaneous-coregion .edge-pattern-solid{stroke-dasharray:0;}#lsc-simultaneous-coregion .edge-thickness-invisible{stroke-width:0;fill:none;}#lsc-simultaneous-coregion .edge-pattern-dashed{stroke-dasharray:3;}#lsc-simultaneous-coregion .edge-pattern-dotted{stroke-dasharray:2;}#lsc-simultaneous-coregion .marker{fill:#333333;stroke:#333333;}#lsc-simultaneous-coregion .marker.cross{stroke:#333333;}#lsc-simultaneous-coregion svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#lsc-simultaneous-coregion p{margin:0;}#lsc-simultaneous-coregion .lsc text{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:14px;fill:#333;}#lsc-simultaneous-coregion .lsc .lsc-frame,#lsc-simultaneous-coregion .lsc .lsc-subchart-frame,#lsc-simultaneous-coregion .lsc .lsc-divider{fill:none;stroke:#333333;stroke-width:1.5px;}#lsc-simultaneous-coregion .lsc .lsc-prechart{fill:none;stroke:#333333;stroke-width:1.5px;stroke-dasharray:6 4;}#lsc-simultaneous-coregion .lsc .lsc-tab{fill:white;stroke:#333333;stroke-width:1.5px;}#lsc-simultaneous-coregion .lsc .lsc-subchart-tab-text,#lsc-simultaneous-coregion .lsc .lsc-note-text,#lsc-simultaneous-coregion .lsc .lsc-diag-text,#lsc-simultaneous-coregion .lsc .lsc-diag-badge-text{font-size:12px;}#lsc-simultaneous-coregion .lsc .lsc-repeat{font-weight:bold;}#lsc-simultaneous-coregion .lsc .lsc-line,#lsc-simultaneous-coregion .lsc .lsc-msg,#lsc-simultaneous-coregion .lsc .lsc-timeout,#lsc-simultaneous-coregion .lsc .lsc-create,#lsc-simultaneous-coregion .lsc .lsc-destroy,#lsc-simultaneous-coregion .lsc .lsc-coregion,#lsc-simultaneous-coregion .lsc .lsc-actor{fill:none;stroke-width:1.5px;}#lsc-simultaneous-coregion .lsc .lsc-hot{stroke:#333333;stroke-dasharray:none;}#lsc-simultaneous-coregion .lsc .lsc-cold{stroke:#333333;stroke-dasharray:6 4;}#lsc-simultaneous-coregion .lsc .lsc-neutral,#lsc-simultaneous-coregion .lsc .lsc-timeout,#lsc-simultaneous-coregion .lsc .lsc-destroy,#lsc-simultaneous-coregion .lsc .lsc-actor{stroke:#333333;stroke-dasharray:none;}#lsc-simultaneous-coregion .lsc.lsc-cue-color .lsc-cold{stroke:#a3a3a3;}#lsc-simultaneous-coregion .lsc .lsc-frame.lsc-hot,#lsc-simultaneous-coregion .lsc .lsc-frame.lsc-cold{stroke:#333333;}#lsc-simultaneous-coregion .lsc .lsc-coregion{stroke:#333333;stroke-dasharray:1.5 3;stroke-linecap:round;}#lsc-simultaneous-coregion .lsc .lsc-create,#lsc-simultaneous-coregion .lsc .lsc-activation{stroke:#333333;stroke-dasharray:6 4;}#lsc-simultaneous-coregion .lsc.lsc-cue-color .lsc-activation{stroke:#a3a3a3;}#lsc-simultaneous-coregion .lsc .lsc-arrowhead{stroke-width:1.5px;stroke-dasharray:none;}#lsc-simultaneous-coregion .lsc .lsc-arrowhead.lsc-filled{fill:#333333;stroke:#333333;}#lsc-simultaneous-coregion .lsc .lsc-arrowhead.lsc-filled.lsc-cold{fill:#333333;stroke:#333333;}#lsc-simultaneous-coregion .lsc.lsc-cue-color .lsc-arrowhead.lsc-filled.lsc-cold{fill:#a3a3a3;stroke:#a3a3a3;}#lsc-simultaneous-coregion .lsc .lsc-arrowhead.lsc-filled.lsc-neutral{fill:#333333;stroke:#333333;}#lsc-simultaneous-coregion .lsc .lsc-arrowhead.lsc-open{fill:none;}#lsc-simultaneous-coregion .lsc .lsc-condition{fill:#ECECFF;stroke-width:1.5px;}#lsc-simultaneous-coregion .lsc .lsc-head{fill:#ECECFF;stroke:#9370DB;stroke-width:1.5px;}#lsc-simultaneous-coregion .lsc .lsc-head-text{fill:black;}#lsc-simultaneous-coregion .lsc .lsc-note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#lsc-simultaneous-coregion .lsc .lsc-note-text{fill:black;}#lsc-simultaneous-coregion .lsc .lsc-badge{fill:white;stroke:#333333;stroke-width:1px;}#lsc-simultaneous-coregion .lsc .lsc-badge-text{font-size:9px;font-weight:bold;fill:#333333;}#lsc-simultaneous-coregion .lsc .lsc-diag-badge{fill:white;stroke:#552222;stroke-width:1px;}#lsc-simultaneous-coregion .lsc .lsc-diag-badge-text{fill:#552222;font-weight:bold;}#lsc-simultaneous-coregion .lsc .lsc-diag-text.lsc-diag-error{fill:#552222;}#lsc-simultaneous-coregion .node .neo-node{stroke:#9370DB;}#lsc-simultaneous-coregion [data-look="neo"].node rect,#lsc-simultaneous-coregion [data-look="neo"].cluster rect,#lsc-simultaneous-coregion [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-simultaneous-coregion [data-look="neo"].swimlane.cluster rect{filter:none;}#lsc-simultaneous-coregion [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#lsc-simultaneous-coregion [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-simultaneous-coregion [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#lsc-simultaneous-coregion [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-simultaneous-coregion [data-look="neo"].node circle .state-start{fill:#000000;}#lsc-simultaneous-coregion