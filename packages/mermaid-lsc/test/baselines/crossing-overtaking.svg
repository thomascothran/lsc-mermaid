sing-overtaking .lsc .lsc-arrowhead.lsc-filled.lsc-neutral{fill:#333333;stroke:#333333;}#lsc-crossing-overtaking .lsc .lsc-arrowhead.lsc-open{fill:none;}#lsc-crossing-overtaking .lsc .lsc-condition{fill:#ECECFF;stroke-width:1.5px;}#lsc-crossing-overtaking .lsc .lsc-head{fill:#ECECFF;stroke:#9370DB;stroke-width:1.5px;}#lsc-crossing-overtaking .lsc .lsc-head-text{fill:black;}#lsc-crossing-overtaking .lsc .lsc-note{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;}#lsc-crossing-overtaking .lsc .lsc-note-text{fill:black;}#lsc-crossing-overtaking .lsc .lsc-badge{fill:white;stroke:#333333;stroke-width:1px;}#lsc-crossing-overtaking .lsc .lsc-badge-text{font-size:9px;font-weight:bold;fill:#333333;}#lsc-crossing-overtaking .lsc .lsc-diag-badge{fill:white;stroke:#552222;stroke-width:1px;}#lsc-crossing-overtaking .lsc .lsc-diag-badge-text{fill:#552222;font-weight:bold;}#lsc-crossing-overtaking .lsc .lsc-diag-text.lsc-diag-error{fill:#552222;}#lsc-crossing-overtaking .node .neo-node{stroke:#9370DB;}#lsc-crossing-overtaking [data-look="neo"].node rect,#lsc-crossing-overtaking [data-look="neo"].cluster rect,#lsc-crossing-overtaking [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-crossing-overtaking [data-look="neo"].swimlane.cluster rect{filter:none;}#lsc-crossing-overtaking [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#lsc-crossing-overtaking [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-crossing-overtaking [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#lsc-crossing-overtaking [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-crossing-overtaking [data-look="neo"].node circle .state-start{fill:#000000;}#lsc-crossing-overtaking [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#lsc-crossing-overtaking [data-look="neo"].icon-shape .ico